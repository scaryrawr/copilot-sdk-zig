name: Sync upstream

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=sync/upstream
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          remote_branch=false
          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null
          status=$?
          set -e
          case "$status" in
            0)
              git fetch origin "$branch"
              remote_branch=true
              ;;
            2)
              ;;
            *)
              exit "$status"
              ;;
          esac
          if [ "$remote_branch" = true ]; then
            git checkout -B "$branch" "origin/$branch"
            git merge --no-edit origin/main
          else
            git checkout -b "$branch" origin/main
          fi
          npm ci
          public_sdk_commit=$(gh api repos/github/copilot-sdk/commits/main --jq .sha)
          log_file=$(mktemp)
          set +e
          npm run sync -- --if-published --public-sdk-commit "$public_sdk_commit" 2>&1 | tee "$log_file"
          sync_status=${PIPESTATUS[0]}
          set -e
          issue_title="Upstream Copilot SDK parity drift detected"
          issue_record=$(gh issue list \
            --state all \
            --search "\"$issue_title\" in:title" \
            --json body,number,state,title \
            --jq ".[] | select(.title == \"$issue_title\" and ((.body // \"\") | contains(\"<!-- sync-upstream-parity-drift -->\"))) | [.number, .state] | @tsv" \
            | head -n 1)
          issue_number=$(printf '%s' "$issue_record" | cut -f1)
          issue_state=$(printf '%s' "$issue_record" | cut -f2)
          if [ "$sync_status" -ne 0 ]; then
            {
              echo '<!-- sync-upstream-parity-drift -->'
              echo 'The scheduled upstream synchronization could not verify the Zig SDK against the latest public Copilot SDK.'
              echo
              echo "- Public SDK commit: \`$public_sdk_commit\`"
              echo "- Protocol commit: \`$(jq -r .upstreamCommit vendor/copilot/upstream.json)\`"
              echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              echo '<details><summary>Verifier output</summary>'
              echo
              echo '```text'
              tail -n 120 "$log_file"
              echo '```'
              echo '</details>'
            } > parity-drift.md
            if [ -n "$issue_number" ]; then
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/issues/$issue_number" \
                -f state=open \
                -f body="$(cat parity-drift.md)" >/dev/null
            else
              gh issue create --title "$issue_title" --body-file parity-drift.md
            fi
            exit "$sync_status"
          fi
          ahead=$(git rev-list --count "origin/main..HEAD")
          if git diff --quiet && [ "$ahead" -eq 0 ]; then
            if [ -n "$issue_number" ] && [ "$issue_state" = "OPEN" ]; then
              gh issue close "$issue_number" \
                --comment "Parity verification succeeds on public SDK commit \`$public_sdk_commit\`."
            fi
            exit 0
          fi
          git add \
            vendor/copilot \
            src/protocol_version.zig \
            src/session_event_generated.zig \
            sync/extensibility-contract.json \
            sync/public-rpc-surface.json \
            sync/schema-snapshot.json \
            sync/stable-parity-contract.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync Copilot SDK contracts"
          fi
          git push --set-upstream origin "$branch"
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          body="Updates the vendored schemas, generated Zig protocol/event sources, and pinned public/protocol parity contracts from github/copilot-sdk main."
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Sync Copilot SDK contracts" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Sync Copilot SDK contracts" --body "$body"
          fi
