name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: zig fmt --check build.zig src examples
      - run: zig build test
      - run: zig build
      - name: Build examples
        run: |
          for example in basic custom-tools external-tools permissions prompt-customization send-and-wait join-session; do
            zig build --build-file "examples/$example/build.zig"
          done
      - name: Check example help
        run: |
          for example in basic custom-tools external-tools permissions prompt-customization send-and-wait; do
            zig build --build-file "examples/$example/build.zig" run -- --help
          done
      - run: npm test
